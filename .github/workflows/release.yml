name: release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Bootstrap
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Read project version and verify release tag
        id: version
        shell: pwsh
        run: |
          $version = (& uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -cne $env:GITHUB_REF_NAME) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match project version 'v$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Prepare offline mount runtimes and installer compiler
        shell: pwsh
        run: |
          ./scripts/setup-drive-runtime.ps1
          ./scripts/setup-winfsp-runtime.ps1
          ./scripts/setup-installer-tools.ps1
      - name: Build production Portable ZIP
        id: package
        shell: pwsh
        run: |
          $output = @(
            ./scripts/build-package.ps1 `
              -VendorDirectory ./vendor/session-manager-plugin `
              -Version '${{ steps.version.outputs.version }}' 2>&1 |
              Tee-Object -FilePath ./release-build.log
          )
          $zip = [string]$output[-1]
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Production package was not created: $zip"
          }
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Package smoke
        shell: pwsh
        run: ./scripts/test-package.ps1 -ZipPath '${{ steps.package.outputs.zip }}'
      - name: Build and verify Setup candidate
        shell: pwsh
        run: |
          $output = @(./scripts/build-installer.ps1 -PackageDirectory ./build/package/aws-connect)
          $setup = [string]$output[-1]
          ./scripts/test-installer.ps1 -SetupPath $setup
          ./scripts/write-release-candidate.ps1 -Directory ./dist -Commit '${{ github.sha }}' -Ref '${{ github.ref }}' -RunId '${{ github.run_id }}'
      - name: Upload candidates for manual VM verification
        uses: actions/upload-artifact@v4
        with:
          name: aws-connect-candidate-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*Setup.exe
            dist/*.sha256
            dist/release-candidate.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-connect-release-diagnostics-${{ github.run_id }}
          path: release-build.log
          if-no-files-found: ignore
          retention-days: 7
