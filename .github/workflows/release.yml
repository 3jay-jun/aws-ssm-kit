name: release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Bootstrap
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Read project version and verify release tag
        id: version
        shell: pwsh
        run: |
          $version = (& uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -cne $env:GITHUB_REF_NAME) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match project version 'v$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build production Portable ZIP
        id: package
        shell: pwsh
        run: |
          $output = @(
            ./scripts/build-package.ps1 `
              -VendorDirectory ./vendor/session-manager-plugin `
              -Version '${{ steps.version.outputs.version }}' 2>&1 |
              Tee-Object -FilePath ./release-build.log
          )
          $zip = [string]$output[-1]
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Production package was not created: $zip"
          }
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Package smoke
        shell: pwsh
        run: ./scripts/test-package.ps1 -ZipPath '${{ steps.package.outputs.zip }}'
      - name: Upload main production package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aws-connect-${{ steps.version.outputs.version }}-windows-x64-main-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-connect-release-diagnostics-${{ github.ref_name }}
          path: |
            release-build.log
            build/package/pyinstaller-work/**/warn-*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = '${{ steps.package.outputs.zip }}'
          & gh release create '${{ github.ref_name }}' `
            $zip "$zip.sha256" `
            --verify-tag `
            --generate-notes `
            --title "aws-ssm-kit ${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed with exit code $LASTEXITCODE."
          }
